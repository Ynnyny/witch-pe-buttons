name: Build PE Buttons
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Witch-Launcher/Witch_launcher
          ref: beta
          path: launcher
          sparse-checkout: |
            Natives/PluginKit
            Natives/glfw_keycodes.h
            scripts/plugins
      - run: pip3 install -r launcher/scripts/plugins/requirements.txt --break-system-packages
      - name: Signing key
        env:
          PLUGIN_PRIVATE_KEY_PEM: ${{ secrets.PLUGIN_PRIVATE_KEY_PEM }}
        run: |
          # The key must be the same for every release: the launcher pins the
          # publisher key of an installed plugin and refuses a build signed
          # with a different key. A throwaway key would break every update.
          if [ -z "$PLUGIN_PRIVATE_KEY_PEM" ]; then
            echo "::error::PLUGIN_PRIVATE_KEY_PEM is not set. Add the publisher key to the repository secrets."
            exit 1
          fi
          mkdir -p keys
          printf '%s\n' "$PLUGIN_PRIVATE_KEY_PEM" > keys/private.pem
      - run: WITCH_LAUNCHER_DIR="$PWD/launcher" PLUGIN_PRIVATE_KEY="$PWD/keys/private.pem" PLUGIN_KEY_ID=pe-buttons ./tools/build_and_pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pe-buttons-plgw
          path: pe-buttons-*.plgw
